name: Arcadian Infracom

description: Arcadian Infracom, founded in 2018 and headquartered in St. Louis, Missouri, builds diverse, long‑haul fiber routes to bridge the
  digital divide. The company develops, constructs, and operates information infrastructure, connecting major data centers and providing low‑cost
  backhaul to rural and tribal communities across the United States. Its mission is to lay the foundation for next‑generation digital services,
  supporting hyperscalers, content providers, and underserved regions.

